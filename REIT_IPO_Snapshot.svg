<text x="96" y="636" font-size="14" fill="#000000">Each REIT shows two bars: market cap at IPO (issue price × total units outstanding immediately after the issue) and GAV / AUM at IPO.</text>
<text x="96" y="656" font-size="14" fill="#000000">“Sold” = the IPO offer (fresh + OFS) as a % of post-issue units; “Sponsor” = units held by the Sponsor and Sponsor Group post-listing.</text>
<text x="96" y="676" font-size="14" fill="#000000">Sources: final offer documents / RHPs (page-cited in REIT_IPO_Snapshot_sources/). Embassy, Brookfield, KRT were all-fresh issues (no OFS).</text>
<text x="96" y="696" font-size="14" fill="#000000">GAV at IPO from the offer-document valuation (Embassy Dec 2018, Mindspace Mar 2020, Brookfield Sep 2020, Nexus Dec 2022, KRT Mar 2025, Bagmane Dec 2025).</text>
<text x="96" y="716" font-size="14" fill="#000000">Mindspace sponsor % (63.2%) is derived from the RHP lock-in schedule (the RHP prints only a pre-Offer 85.31% combined figure). KRT sponsor %</text>
<text x="96" y="736" font-size="14" fill="#000000">(78.5%) is the sponsor + sponsor-group holding on the post-issue base; the KRT RHP states 88.0% on its smaller pre-issue base. Bagmane listed May 2026.</text>
